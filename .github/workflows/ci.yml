name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-target-matrix:
    name: Compute release target matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Export release target matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'matrix<<EOF'
            ./scripts/release-targets.sh matrix-json
            echo EOF
          } >> "$GITHUB_OUTPUT"

  rust-gate:
    name: Rust Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Rust toolchains
        shell: bash
        run: bash ./scripts/bootstrap-rust-tools.sh install-toolchains

      - name: Install shellcheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Install pinned Rust QA tools
        shell: bash
        run: bash ./scripts/bootstrap-rust-tools.sh install-qa-tools

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run Rust workspace gate
        shell: bash
        run: ./check.sh

  devcontainer-changes:
    name: Detect devcontainer changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect devcontainer-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}" -- \
            '.devcontainer' \
            'scripts/validate-devcontainer.sh' \
            'scripts/run-devcontainer-check.sh' \
            'scripts/devcontainer-prepare-user-home.sh' \
            'scripts/devcontainer-cli-helper.Dockerfile' \
            'scripts/common.sh' \
            'check.sh')
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  contributor-devcontainer-gate:
    name: Contributor devcontainer gate
    needs: [devcontainer-changes]
    if: needs.devcontainer-changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FFHN_DEVCONTAINER_VOLUME_MODE: shared-ci
      FFHN_DEVCONTAINER_SKIP_BUILD: 1

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate committed contributor devcontainer
        shell: bash
        run: ./scripts/validate-devcontainer.sh

      - name: Run full headless contributor devcontainer gate
        shell: bash
        run: ./scripts/run-devcontainer-check.sh

  cross-platform-rust-gate:
    name: Cross-platform Rust gate (${{ matrix.id }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            runs_on: macos-15
            timeout_minutes: 30
          - id: windows-x64
            runs_on: windows-2022
            timeout_minutes: 150

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Rust stable toolchain
        shell: bash
        run: bash ./scripts/bootstrap-rust-tools.sh install-stable-toolchain

      - name: Install pinned cross-platform Rust QA tools
        shell: bash
        run: bash ./scripts/bootstrap-rust-tools.sh install-cross-platform-qa-tools

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: cross-platform-${{ matrix.id }}

      - name: Exclude build directory from Windows Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $artifactRoot = Join-Path "${{ github.workspace }}" "..\.ffhn-artifacts"
          Add-MpPreference -ExclusionPath (Join-Path $artifactRoot "target")
          Add-MpPreference -ExclusionPath (Join-Path $artifactRoot "build")

      - name: Check formatting
        shell: bash
        run: cargo fmt --check

      - name: Run Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run workspace tests
        shell: bash
        run: cargo nextest run --no-fail-fast --workspace --all-targets --all-features --locked

      - name: Audit dependencies
        shell: bash
        run: cargo audit -D warnings

      - name: Audit fuzz dependencies
        shell: bash
        run: cargo audit --file fuzz/Cargo.lock -D warnings

      - name: Enforce dependency policy
        shell: bash
        run: cargo deny check advisories bans licenses sources

      - name: Run semver gate
        shell: bash
        run: cargo xtask semver-check

  release-target-smoke:
    name: Release target smoke ${{ matrix.id }}
    needs:
      - release-target-matrix
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.release-target-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Linux musl toolchain packages
        if: ${{ matrix.needs_musl_tools }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install pinned Rust stable toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/bootstrap-rust-tools.sh install-stable-toolchain
          rustup target add "${{ matrix.target_triple }}"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target_triple }}

      - name: Build standalone package
        shell: bash
        run: ./scripts/build-release-artifact.sh "${{ matrix.target_triple }}"

      - name: Smoke test standalone package
        shell: bash
        run: ./scripts/smoke-release-artifact.sh "${{ matrix.target_triple }}"

  check:
    name: Check
    if: always()
    needs:
      - rust-gate
      - devcontainer-changes
      - contributor-devcontainer-gate
      - cross-platform-rust-gate
      - release-target-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Confirm aggregate gate success
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          if echo "$RESULTS" | grep -q '"failure"'; then
            echo "A required job failed."
            exit 1
          fi
          if echo "$RESULTS" | grep -q '"cancelled"'; then
            echo "A required job was cancelled."
            exit 1
          fi
          echo "All required jobs passed or were skipped."
