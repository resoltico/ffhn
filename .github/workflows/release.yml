name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build, publish, and verify (for example v3.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publication-${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  release-target-matrix:
    name: Compute release target matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Export release target matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'matrix<<EOF'
            ./scripts/release-targets.sh matrix-json
            echo EOF
          } >> "$GITHUB_OUTPUT"

  build-archives:
    name: Build release archives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Read workspace version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(./scripts/workspace-package-field.sh version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $VERSION"

      - name: Determine target release tag
        id: target-tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "${TAG}" ]; then
            echo "::error::target release tag is required"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag matches workspace version
        run: |
          set -euo pipefail
          TAG_VERSION="${{ steps.target-tag.outputs.version }}"
          WORKSPACE_VERSION="${{ steps.version.outputs.version }}"

          if [ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]; then
            echo "::error::Release tag version ($TAG_VERSION) does not match Cargo.toml version ($WORKSPACE_VERSION)"
            exit 1
          fi

      - name: Create release archives
        run: ./scripts/build-release-source-archives.sh

      - name: Generate source archive attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/ffhn-source-${{ steps.version.outputs.version }}.zip
            dist/ffhn-source-${{ steps.version.outputs.version }}.tar.gz

      - name: Upload archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-standalone:
    name: Build standalone ${{ matrix.id }} package
    needs:
      - release-target-matrix
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.release-target-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Install Linux musl toolchain packages
        if: ${{ matrix.needs_musl_tools }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install pinned Rust stable toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/bootstrap-rust-tools.sh install-stable-toolchain
          rustup target add "${{ matrix.target_triple }}"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target_triple }}
          cache-bin: false

      - name: Read workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(./scripts/workspace-package-field.sh version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $VERSION"

      - name: Determine target release tag
        id: target-tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "${TAG}" ]; then
            echo "::error::target release tag is required"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag matches workspace version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${{ steps.target-tag.outputs.version }}"
          WORKSPACE_VERSION="${{ steps.version.outputs.version }}"

          if [ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]; then
            echo "::error::Release tag version ($TAG_VERSION) does not match Cargo.toml version ($WORKSPACE_VERSION)"
            exit 1
          fi

      - name: Resolve artifact names
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/release-targets.sh
          VERSION="${{ steps.version.outputs.version }}"
          echo "package=$(release_package_name_for_target "$VERSION" "${{ matrix.target_triple }}")" >> "$GITHUB_OUTPUT"

      - name: Build standalone package
        shell: bash
        run: ./scripts/build-release-artifact.sh "${{ matrix.target_triple }}"

      - name: Smoke test standalone package
        shell: bash
        run: ./scripts/smoke-release-artifact.sh "${{ matrix.target_triple }}"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/${{ steps.artifact.outputs.package }}

      - name: Upload standalone artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_bundle_name }}
          path: dist/${{ steps.artifact.outputs.package }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - build-archives
      - build-standalone
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # Publication logic must come from the maintained default branch so a rerun can
          # repair release tooling without mutating an existing tag.
          ref: ${{ github.event.repository.default_branch }}

      - name: Determine target release tag
        id: target-tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "${TAG}" ]; then
            echo "::error::target release tag is required"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download archive artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archives
          path: dist/

      - name: Download standalone artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: standalone-*
          path: dist/
          merge-multiple: true

      - name: Build checksum manifest
        env:
          RELEASE_VERSION: ${{ steps.target-tag.outputs.version }}
        run: ./scripts/build-release-checksums.sh

      - name: Generate checksum manifest attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/ffhn-${{ steps.target-tag.outputs.version }}-checksums.txt

      - name: Publish GitHub release idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target-tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.target-tag.outputs.version }}
        run: ./scripts/publish-github-release.sh

      - name: Verify GitHub release handoff
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target-tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.target-tag.outputs.version }}
        run: ./scripts/verify-github-release.sh
