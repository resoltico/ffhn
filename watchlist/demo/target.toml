schema_name = "ffhn.target"
schema_version = 9
target_id = "demo"
display_name = "Example Repository Stars"
enabled = true
escalate_after = 3
declared_type = "integer"
conditions = []

[target]
kind = "http"
source_url = "https://api.github.com/repos/resoltico/ffhn"

[fetch]
engine = "http"
method = "GET"
timeout_ms = 15000
max_bytes = 2000000
user_agent = "ffhn/demo"
follow_redirects = true
accept = "application/json"

[projection]
kind = "json_pointer"
pointer = "/stargazers_count"
