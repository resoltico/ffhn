[package]
name = "ffhn-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Deterministic monitoring engine for FFHN."

[dependencies]
encoding_rs.workspace = true
fs2.workspace = true
htmlcut-core.workspace = true
regex.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
ureq.workspace = true
url.workspace = true

[lints]
workspace = true

[workspace.dependencies]
assert_cmd = "2.2.1"
encoding_rs = "0.8.35"
fs2 = "0.4.3"
predicates = "3.1.4"
regex = "1.12.3"
scraper = "0.27.0"
serde_json = "1.0.149"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"

[workspace.dependencies.clap]
features = ["derive"]
version = "4.6.1"

[workspace.dependencies.ffhn-core]
path = "crates/ffhn-core"
version = "7.0.0"

[workspace.dependencies.htmlcut-core]
git = "https://github.com/resoltico/HTMLCut.git"
package = "htmlcut-core"
tag = "v10.0.0"
version = "10.0.0"

[workspace.dependencies.serde]
features = ["derive"]
version = "1.0.228"

[workspace.dependencies.time]
features = ["formatting", "parsing"]
version = "0.3.47"

[workspace.dependencies.ureq]
default-features = false
features = ["gzip", "platform-verifier", "rustls"]
version = "3.3.0"

[workspace.dependencies.url]
features = ["serde"]
version = "2.5.8"

[workspace.lints.clippy]
all = "warn"
cast_possible_truncation = "warn"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.package]
authors = ["Ervins Strauhmanis"]
description = "Deterministic monitoring for websites and local HTML files with repeatable checks and JSON reports"
edition = "2024"
homepage = "https://github.com/resoltico/ffhn"
license = "MIT"
repository = "https://github.com/resoltico/ffhn"
rust-version = "1.95"
version = "7.0.0"
