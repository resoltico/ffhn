[workspace]
members = [
    "crates/ffhn-core",
    "crates/ffhn-cli",
    "xtask",
]
exclude = ["semver-baseline/ffhn-core"]
resolver = "3"

[workspace.package]
version = "11.0.0"
edition = "2024"
rust-version = "1.98"
description = "Deterministic observation graphs for typed HTTP and local-file measurements"
license = "MIT"
authors = ["Ervins Strauhmanis"]
repository = "https://github.com/resoltico/ffhn"
homepage = "https://github.com/resoltico/ffhn"

[workspace.dependencies]
assert_cmd = "2.2.2"
base64 = "0.23.1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
clap = { version = "4.6.6", features = ["derive"] }
ffhn-core = { path = "crates/ffhn-core", version = "=11.0.0" }
fs2 = "0.4.3"
htmlcut-core = { version = "=13.2.0", git = "https://github.com/resoltico/HTMLCut.git", tag = "v13.2.0", package = "htmlcut-core" }
predicates = "3.1.4"
process-wrap = { version = "10.0.0", default-features = false, features = ["std", "process-group", "job-object"] }
serde = { version = "1.0.229", features = ["derive"] }
rust_decimal = { version = "=1.42.1", default-features = false, features = ["std"] }
semver = "1.0.28"
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
toml = "1.1.4"
ureq = { version = "3.4.0", default-features = false, features = ["gzip", "platform-verifier", "rustls"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.25.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
cast_possible_truncation = "warn"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
incremental = false

[profile.test]
incremental = false
