[workspace]
members = [
    "crates/ffhn-core",
    "crates/ffhn-cli",
    "xtask",
]
exclude = ["semver-baseline/ffhn-core"]
resolver = "3"

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.95"
description = "Deterministic website monitoring built around FFHN-owned fetch, compare, persistence, and reporting."
license = "MIT"
authors = ["Ervins Strauhmanis"]
repository = "https://github.com/resoltico/ffhn"
homepage = "https://github.com/resoltico/ffhn"

[workspace.dependencies]
assert_cmd = "2.2.0"
clap = { version = "4.6.0", features = ["derive"] }
encoding_rs = "0.8.35"
ffhn-core = { path = "crates/ffhn-core", version = "2.1.0" }
fs2 = "0.4.3"
htmlcut-core = { version = "4.3.0", git = "https://github.com/resoltico/HTMLCut.git", tag = "v4.3.0", package = "htmlcut-core" }
predicates = "3.1.4"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
toml = "1.1.2"
ureq = { version = "3.3.0", default-features = false, features = ["gzip", "platform-verifier", "rustls"] }
url = { version = "2.5.8", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
incremental = false

[profile.test]
incremental = false
