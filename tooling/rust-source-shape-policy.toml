match = "prefix"
role = "core-foundation"
owner = "FFHN core foundation"
rationale = "Foundation modules provide only crate-wide error, path, serialization, and public-boundary primitives."
split_trigger = "a file gains feature-specific policy or runtime orchestration, or exceeds any declared budget"
