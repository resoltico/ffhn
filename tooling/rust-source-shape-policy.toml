max_physical_lines = 600
max_items = 70
max_public_items = 30
max_imports = 24
max_functions = 55
max_decision_points = 180
max_match_arms = 80
allowed_internal_dependencies = ["crate", "contract", "model", "paths", "stable_json", "test_support"]

