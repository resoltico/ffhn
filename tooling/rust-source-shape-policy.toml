version = 1

# This is an executable ownership contract, not a formatting preference. Every maintained Rust
# source file must resolve to one rule. Prefix rules describe stable module families; a new file
# outside those families is rejected until its ownership and dependency boundary are explicit.

[[rules]]
path = "crates/ffhn-core/src/model/tests/"
match = "prefix"
role = "core-model-test-scenario"
owner = "FFHN core model"
rationale = "Each scenario file proves one model contract without becoming an alternate model implementation."
split_trigger = "a scenario needs unrelated aggregate setup or exceeds any declared budget"
max_physical_lines = 600
max_items = 80
max_public_items = 0
max_imports = 20
max_functions = 60
max_decision_points = 180
max_match_arms = 80
allowed_internal_dependencies = ["crate", "contract", "model", "paths", "stable_json", "test_support"]

[[rules]]
path = "crates/ffhn-core/src/model/delivery/tests/"
match = "prefix"
role = "core-model-test-scenario"
owner = "FFHN core model"
rationale = "Each delivery scenario proves one durable event or payload contract without becoming an alternate implementation."
split_trigger = "a scenario needs unrelated aggregate setup or exceeds any declared budget"
max_physical_lines = 600
max_items = 80
max_public_items = 0
max_imports = 20
max_functions = 60
max_decision_points = 180
max_match_arms = 80
allowed_internal_dependencies = ["crate", "contract", "model", "paths", "stable_json", "test_support"]

