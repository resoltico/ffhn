split_trigger = "a file combines schema vocabulary with unrelated parsing or exceeds any declared budget"
max_physical_lines = 500
max_items = 60
max_public_items = 30
max_imports = 20
max_functions = 45
max_decision_points = 140
max_match_arms = 70
allowed_internal_dependencies = ["crate", "contract", "model", "stable_json"]

