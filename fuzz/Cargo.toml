[package]
name = "ffhn-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
ffhn-core = { path = "../crates/ffhn-core" }
libfuzzer-sys = "0.4.12"
serde_json = "1.0.149"
tempfile = "3.27.0"
toml = "0.8.23"

[[bin]]
name = "target_toml_documents"
path = "fuzz_targets/target_toml_documents.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state_and_report_json_documents"
path = "fuzz_targets/state_and_report_json_documents.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dry_run_file_targets"
path = "fuzz_targets/dry_run_file_targets.rs"
test = false
doc = false
bench = false

[profile.dev]
incremental = false

[profile.test]
incremental = false
