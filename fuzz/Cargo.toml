[package]
name = "ffhn-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
ffhn-core = { path = "../crates/ffhn-core" }
libfuzzer-sys = "0.4.13"
serde_json = "1.0.151"
tempfile = "3.27.0"
toml = "1.1.4"

[[bin]]
name = "graph_toml_documents"
path = "fuzz_targets/graph_toml_documents.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graph_json_documents"
path = "fuzz_targets/graph_json_documents.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dry_run_file_sources"
path = "fuzz_targets/dry_run_file_sources.rs"
test = false
doc = false
bench = false

[profile.dev]
incremental = false

[profile.test]
incremental = false
