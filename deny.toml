[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
ignore = []
yanked = "deny"
unmaintained = "all"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.93
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = [
    { crate = "getrandom@0.2.17", reason = "ring currently requires the 0.2 line while tempfile and dev tooling use 0.4" },
    { crate = "io-lifetimes@2.0.4", reason = "current cap-primitives 4.0.3 requires io-lifetimes 3 directly while its current fs-set-times 0.20.3 dependency still requires io-lifetimes 2" },
    { crate = "syn@2.0.119", reason = "HTMLCut, Clap, and Serde derive dependencies require the 2.x API while FFHN's direct source-analysis tooling uses syn 3." },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/resoltico/HTMLCut.git"]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
